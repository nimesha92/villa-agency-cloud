apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: villa-agency-alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/success-codes: "200,301,302"
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /properties
            pathType: Prefix
            backend:
              service:
                name: property-service
                port:
                  number: 8000
          - path: /agents
            pathType: Prefix
            backend:
              service:
                name: agent-service
                port:
                  number: 8000
          - path: /enquiries
            pathType: Prefix
            backend:
              service:
                name: enquiry-service
                port:
                  number: 8000
          - path: /track
            pathType: Prefix
            backend:
              service:
                name: analytics-service
                port:
                  number: 8004
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: analytics-service
                port:
                  number: 8004
          - path: /openapi.json
            pathType: Exact
            backend:
              service:
                name: analytics-service
                port:
                  number: 8004
          - path: /metabase
            pathType: Prefix
            backend:
              service:
                name: metabase-service
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: villa-frontend-service
                port:
                  number: 80