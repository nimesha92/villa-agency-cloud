apiVersion: apps/v1
kind: Deployment
metadata:
  name: metabase-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metabase-server
  template:
    metadata:
      labels:
        app: metabase-server
    spec:
      containers:
      - name: metabase
        image: metabase/metabase:latest
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: metabase-service
spec:
  type: ClusterIP
  selector:
    app: metabase-server
  ports:
  - port: 3000
    targetPort: 3000
