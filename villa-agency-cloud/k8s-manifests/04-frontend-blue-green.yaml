apiVersion: apps/v1
kind: Deployment
metadata:
  name: villa-frontend-blue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: villa-frontend
      version: blue
  template:
    metadata:
      labels:
        app: villa-frontend
        version: blue
    spec:
      containers:
      - name: frontend
        image: nalin745/villa-frontend:v3
        ports:
        - containerPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: villa-frontend-green
spec:
  replicas: 1
  selector:
    matchLabels:
      app: villa-frontend
      version: green
  template:
    metadata:
      labels:
        app: villa-frontend
        version: green
    spec:
      containers:
      - name: frontend
        image: nalin745/villa-frontend:v1
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: villa-frontend-service
spec:
  type: ClusterIP
  selector:
    app: villa-frontend
    version: blue
  ports:
  - port: 80
    targetPort: 80
